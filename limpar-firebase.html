<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Limpeza única do histórico Firebase</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:680px;margin:40px auto;padding:0 18px;line-height:1.5}
    .box{border:1px solid #ccc;border-radius:10px;padding:20px}
    button{font-size:18px;padding:12px 18px;cursor:pointer}
    #status{margin-top:16px;font-weight:700;white-space:pre-wrap}
    .ok{color:#087a32}.erro{color:#b00020}.aviso{color:#8a5200}
  </style>
</head>
<body>
  <div class="box">
    <h1>Limpeza única do histórico</h1>
    <p>Este arquivo apaga somente <code>historico_compartilhado</code> do Firebase do projeto <strong>projeto-padroes</strong>.</p>
    <p><strong>Não apaga o backup local, mercados, configurações ou outros nós do banco.</strong></p>
    <button id="limpar">Apagar histórico agora</button>
    <div id="status" class="aviso">Aguardando...</div>
  </div>

<script>
"use strict";
(() => {
  const URL = "https://projeto-padroes-default-rtdb.firebaseio.com/historico_compartilhado.json";
  const btn = document.getElementById("limpar");
  const status = document.getElementById("status");

  async function ler() {
    const r = await fetch(URL, { cache: "no-store" });
    if (!r.ok) throw new Error(`GET HTTP ${r.status}`);
    return r.json();
  }

  async function limpar() {
    btn.disabled = true;
    status.className = "aviso";
    status.textContent = "Apagando historico_compartilhado...";
    try {
      const del = await fetch(URL, { method: "DELETE", cache: "no-store" });
      if (!del.ok) throw new Error(`DELETE HTTP ${del.status}`);

      const depois = await ler();
      if (depois !== null) throw new Error("O Firebase respondeu, mas o histórico ainda contém dados.");

      status.className = "ok";
      status.textContent = "✅ Histórico apagado com sucesso. O nó historico_compartilhado está vazio (null).\n\nAgora remova este arquivo do GitHub e publique a versão normal do aplicativo.";
    } catch (e) {
      console.error(e);
      status.className = "erro";
      status.textContent = "❌ Não foi possível apagar o histórico: " + (e?.message || e);
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", limpar);
})();
</script>
</body>
</html>
